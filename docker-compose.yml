services:
  db:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - Backend-Net

  backend:
    container_name: Backend
    build:
      context: .
    volumes:
      - static_volume:/Backend/static
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    networks:
      - Backend-Net
    restart: always
    command: >
      sh -c "python wait_mysql.py &&
            python manage.py collectstatic --noinput &&
            python manage.py makemigrations &&
            python manage.py migrate &&
            gunicorn --bind 0.0.0.0:8000 config.wsgi:application --timeout 300"
    labels:
      - "traefik.enable=true"
      # HTTP 라우터
      - "traefik.http.routers.backend-secure.rule=Host(`api.morphmall.shop`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.service=backend_service"
      - "traefik.http.services.backend_service.loadbalancer.server.port=8000"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.backend.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      # HTTPS 라우터
      - "traefik.http.routers.backend-secure.rule=Host(`api.morphmall.shop`)"
      - "traefik.http.routers.backend-secure.entrypoints=websecure"
      - "traefik.http.routers.backend-secure.tls=true"
      - "traefik.http.routers.backend-secure.tls.certresolver=myresolver"
      - "traefik.http.routers.backend-secure.service=backend_service"
    privileged: true

  traefik:
    image: traefik:v2.10
    container_name: Board-Traefik
    command:
      # 대시보드(옵션)
      - "--api.insecure=true"
      # Docker provider 활성화
      - "--providers.docker=true"
      # HTTP entryPoint
      - "--entrypoints.web.address=:80"
      # HTTPS entryPoint
      - "--entrypoints.websecure.address=:443"
      # ACME (Let's Encrypt) 설정
      - "--certificatesresolvers.myresolver.acme.email=ymkim2353@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - Backend-Net

  rabbitmq:
    image: "rabbitmq:3.13-management"
    container_name: rabbitmq
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - 5672:5672
      - 15672:15672
    depends_on:
      - backend
    restart: always
    tty: true
    expose:
      - 5672
    networks:
      - Backend-Net

  celery_io:
    build:
      context: .
    volumes:
      - ./:/app
    command: >
      celery -A config worker
      --pool=eventlet
      --concurrency=250
      --queues=io
      --loglevel=info
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - rabbitmq
      - backend
    restart: always
    tty: true
    networks:
      - Backend-Net
    labels:
      - "traefik.enable=false"

  celery_cpu:
    build:
      context: .
    volumes:
      - ./:/app
    command: >
      celery -A config worker
      --pool=prefork
      --concurrency=4
      --queues=cpu
      -E --loglevel=info
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - rabbitmq
      - backend
    restart: always
    networks:
      - Backend-Net
    labels:
      - "traefik.enable=false"

  celery_beat:
    container_name: celery_beat
    build:
      context: .
    volumes:
      - ./:/app
    command: celery -A config beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - rabbitmq
      - backend
    restart: always
    tty: true
    networks:
      - Backend-Net
    labels:
      - "traefik.enable=false"
  
  flower:
    image: mher/flower
    container_name: flower
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - TZ=Asia/Seoul
    ports:
      - '5555:5555'
    depends_on:
      - rabbitmq
      - celery_io
      - celery_cpu
      - celery_beat
    networks:
      - Backend-Net
    labels:
      - "traefik.enable=false"

  prometheus:
    image: prom/prometheus:v2.45.6
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - Backend-Net

  grafana:
    image: grafana/grafana:9.5.20
    container_name: grafana
    volumes:
      - ./grafana:/etc/grafana/provisioning
      - ./grafana/data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - Backend-Net

  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      # '--path.rootfs=/rootfs'  # 삭제
    ports:
      - "9100:9100"
    networks:
      - Backend-Net

  mysql-exporter: #서비스 이름
    image: prom/mysqld-exporter:main #이미지
    container_name: mysql-exporter
    ports:
      - "9104:9104" #포트 9104 매핑
    volumes:
      - ./mysql-exporter/my-config.conf:/cfg/my-config.conf #conf파일을 위한 로컬 볼륨 마운트
    environment: # 메트릭 수집할 내용 & 데이터 주소
      - DATA_SOURCE_NAME='root:root@(db:3306)/test' # rds로 올렸으면 이 부분은 다른 서비스들에서 디비 연결 하시는거로 사용하시면 됩니다. (루트 미사용시 수집되는 메트릭이 다를수 있습니다)
      - collect.info_schema.tablestats=true
      - collect.info_schema.userstats=true
      - collect.info_schema.query_response_time=true
      - collect.auto_increment.columns=true
      - collect.binlog_size=true
      - collect.perf_schema.eventsstatements=true
      - collect.perf_schema.eventswaits=true
      - collect.perf_schema.file_events=true
      - collect.perf_schema.indexiowaits=true
      - collect.perf_schema.tableiowaits=true
      - collect.perf_schema.tablelocks=true
    networks:
      - Backend-Net
    depends_on:
      - db
    command:
      - '--config.my-cnf=/cfg/my-config.conf' #로컬 볼륨에 마운트된 conf파일 설정

  cadvisor: #서비스 이름
    image: gcr.io/cadvisor/cadvisor:v0.49.1 #이미지
    container_name: cadvisor
    ports:
      - "8090:8080" #포트 8080 매핑
    volumes:
      - /:/rootfs:ro #읽기 전용 데이터 - 루트 파일 시스템
      - /var/run:/var/run:rw #읽기 & 쓰기 - 런타임 데이터
      - /sys:/sys:ro  #읽기 전용 데이터 - 커널, 하드웨어, 드라이버 정보 등등
      - /var/lib/docker/:/var/lib/docker:ro #읽기 전용 데이터 - 도커 정보 데이터
    networks:
      - Backend-Net

volumes:
  db_data:
  static_volume:
  letsencrypt:

networks:
  Backend-Net:
    driver: bridge